services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongo_data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
  app:
    build: .
    ports: ["3000:3000"]
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: tachometer
      REQUIRE_MONGO: "1"
    depends_on:
      mongo:
        condition: service_healthy
volumes:
  mongo_data:
